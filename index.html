<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Parquímetro EBAC</title>
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <h1>Parquímetro EBAC</h1>
            <p>Informe o valor disponível para descobrir seu tempo de estacionamento :)</p>
        </header>

        <form id="formulario">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" name="valor" step="0.01" min="0">
            <button type="submit">Calcular</button>
        </form>
        <div id="resultado"></div>
        <footer id="texto-rodape"> Tempo máximo: 120 minutos</footer>
    </main>

    <script src="parquimetro.js"></script>
    
</body>
</html>
